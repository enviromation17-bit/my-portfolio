<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Renolt — Stop Losing Enquiries</title>
<meta name="description" content="Renolt helps service businesses stop losing enquiries from WhatsApp, phone, forms and email.">
<meta name="theme-color" content="#08090c">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
</head>
<body>
<script src="s1.js"></script>
<script src="s2.js"></script>
<script>
(function(){
  var b64 = window.__S1 + window.__S2;
  var bin = atob(b64);
  var bytes = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  var html = pako.ungzip(bytes, {to:'string'});
  document.open(); document.write(html); document.close();
})();
</script>
</body>
</html>
